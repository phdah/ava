name: Python tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: python -m unittest discover -s internal/release/tests -p "test_*.py" -v

  opencode:
    name: OpenCode 1.18.7
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pinned OpenCode
        run: npm install --global opencode-ai@1.18.7

      - name: Validate OpenCode fixture
        env:
          AVA_OPENCODE_LIVE: "1"
        run: python -m unittest -v internal.release.tests.test_opencode
