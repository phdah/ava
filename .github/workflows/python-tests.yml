name: Python tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: python -m unittest discover -s internal/release/tests -p "test_*.py" -v
