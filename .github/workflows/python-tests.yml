name: Python tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate internal Backlog.md task state
        run: python3 internal/todo/validate.py

      - name: Validate Backlog.md native parsing
        run: |
          npx -y backlog.md@1.50.1 task list --json \
            | jq -e '.tasks | length == 0' >/dev/null

      - name: Exercise Backlog.md completed lifecycle
        run: |
          test_root="$RUNNER_TEMP/ava-backlog-lifecycle"
          mkdir -p "$test_root"
          cp -a "$GITHUB_WORKSPACE/." "$test_root/"
          cd "$test_root"

          task_file="ava-5641 - Graduate Ava from alpha releases to stable 1.0.0.md"
          cp "internal/todo/completed/$task_file" "internal/todo/tasks/$task_file"
          rm "internal/todo/completed/$task_file"

          milestone_file="m-0 - v1.0.0.md"
          mkdir -p internal/todo/milestones
          cp "internal/todo/archive/milestones/$milestone_file" "internal/todo/milestones/$milestone_file"
          rm "internal/todo/archive/milestones/$milestone_file"

          npx -y backlog.md@1.50.1 task complete ava-5641 >/dev/null
          npx -y backlog.md@1.50.1 milestone archive m-0 >/dev/null

          test -f "internal/todo/completed/$task_file"
          test ! -f "internal/todo/tasks/$task_file"
          test -f "internal/todo/archive/milestones/$milestone_file"
          test ! -f "internal/todo/milestones/$milestone_file"
          python3 internal/todo/validate.py

      - name: Smoke test Backlog.md browser
        run: |
          browser_log="$RUNNER_TEMP/backlog-browser.log"
          npx -y backlog.md@1.50.1 browser --no-open >"$browser_log" 2>&1 &
          browser_pid=$!
          trap 'kill "$browser_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6420/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$browser_log"
          exit 1

      - name: Exercise installed project task board
        run: internal/release/test-project-backlog.sh

      - name: Run release qualification
        run: internal/release/test.sh
