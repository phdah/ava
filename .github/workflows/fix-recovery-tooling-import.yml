name: fix recovery tooling import

on:
  push:
    branches: [fix/recovery-tooling-import]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded recovery import fix
        run: python3 .github/scripts/fix_recovery_import.py
      - name: Validate targeted workflow tests
        run: python3 -m unittest internal.release.tests.test_publication_workflow internal.release.tests.test_publication
      - name: Validate maintained release suite
        run: internal/release/test.sh
      - name: Commit validated fix and remove temporary helper
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/fix_recovery_import.py .github/workflows/fix-recovery-tooling-import.yml
          git add -A
          git commit -m "chore(release): execute maintained recovery tooling"
          git push origin HEAD:fix/recovery-tooling-import
