name: Resolve PR 64 merge conflict

on:
  push:
    branches:
      - agent/enforce-semantic-impact-assessment

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/enforce-semantic-impact-assessment

      - name: Merge main and resolve release test runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ "$merge_status" -ne 0 && "$conflicts" != "internal/release/test.sh" ]]; then
            echo "Unexpected conflicts:"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          if [[ -n "$conflicts" ]]; then
            git checkout --ours internal/release/test.sh
            python3 - <<'PY'
          from pathlib import Path

          path = Path("internal/release/test.sh")
          text = path.read_text()
          transaction = "  internal.release.tests.test_transaction_cleanup \\\n"
          semantic = "  internal.release.tests.test_semantic_upgrade \\\n"
          text = text.replace(transaction, "").replace(semantic, "")
          marker = "  internal.release.tests.test_installer \\\n"
          if marker not in text:
              raise SystemExit("test_installer marker missing from release test runner")
          text = text.replace(marker, marker + transaction + semantic, 1)
          path.write_text(text)
          PY
            git add internal/release/test.sh
          fi

          git rm .github/workflows/resolve-pr64-merge.yml
          git commit -m "merge main into semantic impact assessment"
          git push origin HEAD:agent/enforce-semantic-impact-assessment
