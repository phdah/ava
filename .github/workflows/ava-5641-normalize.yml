name: AVA-5641 stable lineage normalization

on:
  push:
    branches:
      - ava-5641-clean-stable-baseline

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ava-5641-clean-stable-baseline
          fetch-depth: 0

      - name: Normalize remaining synthetic release identities
        run: |
          sed -i "s/gate_replacement = '''/gate_replacement = r'''/" internal/release/normalize_stable_lineage_tmp.py
          PYTHONPATH="$GITHUB_WORKSPACE" python3 internal/release/normalize_stable_lineage_tmp.py

      - name: Remove temporary normalization machinery
        run: |
          rm internal/release/normalize_stable_lineage_tmp.py
          rm .github/workflows/ava-5641-normalize.yml

      - name: Prove clean stable lineage and maintained suite
        run: |
          python3 internal/release/tests/test_stable_lineage_clean.py
          internal/release/test.sh

      - name: Commit normalized stable fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(release): normalize stable lineage fixtures"
          git push origin HEAD:ava-5641-clean-stable-baseline
