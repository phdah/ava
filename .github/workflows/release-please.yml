name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to recover, for example v1.0.0-alpha.17"
        required: false
        type: string

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create release identity without next-PR maintenance
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Check out maintained publication tooling
        uses: actions/checkout@v4
        with:
          path: tooling

      - name: Check out exact publication source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve durable publication identity
        id: identity
        working-directory: source
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          PYTHONPATH="$GITHUB_WORKSPACE/tooling" \
            python3 -m internal.release.publication \
              --root "$GITHUB_WORKSPACE/source" \
              identity \
              --tag "$RECOVERY_TAG"

      - name: Report release-please identity hint
        if: ${{ steps.release.outputs.sha != '' }}
        env:
          RELEASE_PLEASE_SHA: ${{ steps.release.outputs.sha }}
        run: echo "release-please reported source revision $RELEASE_PLEASE_SHA"

      - name: Fail an unresolved release-please attempt
        if: ${{ steps.identity.outputs.eligible != 'true' && steps.release.outcome == 'failure' }}
        run: |
          echo "release-please failed before establishing a durable tag at this revision" >&2
          exit 1

      - name: Validate prepared identity and accepted qualification
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        working-directory: source
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_REVISION: ${{ steps.identity.outputs.source_revision }}
          PREVIOUS_REVISION: ${{ steps.identity.outputs.previous_revision }}
          PREVIOUS_VERSION: ${{ steps.identity.outputs.previous_version }}
        run: |
          set -eu
          test "$TAG" = "v$VERSION"
          test "$(cat version.txt)" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_REVISION"
          python3 -m internal.release.validate_release_pr \
            --previous-version "$PREVIOUS_VERSION" \
            --base-revision "$PREVIOUS_REVISION"
          python3 -m internal.release.qualification_acceptance \
            validate-release-pr \
            --previous-version "$PREVIOUS_VERSION" \
            --base-revision "$PREVIOUS_REVISION"
          internal/release/test.sh

      - name: Assemble release twice
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        working-directory: source
        run: |
          set -eu
          for output in release-a release-b; do
            AVA_UPGRADE_CATALOG=internal/release/catalogs/${{ steps.identity.outputs.version }}.json \
              internal/release/assemble.sh \
              --output "$output" \
              --version "${{ steps.identity.outputs.version }}" \
              --channel "${{ steps.identity.outputs.channel }}" \
              --source-revision "${{ steps.identity.outputs.source_revision }}" \
              --source-date-epoch "${{ steps.identity.outputs.source_date_epoch }}" \
              --published-at "${{ steps.identity.outputs.published_at }}" \
              --release-notes CHANGELOG.md
          done
          (cd release-a && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-a.sha256
          (cd release-b && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-b.sha256
          cmp release-a.sha256 release-b.sha256
          python3 -m internal.release.conformance --root release-a --mode release --format text

      - name: Prepare exact GitHub Release notes
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        working-directory: source
        run: |
          set -eu
          PYTHONPATH="$GITHUB_WORKSPACE/tooling" \
            python3 -m internal.release.publication \
              notes \
              --version "${{ steps.identity.outputs.version }}" \
              --changelog CHANGELOG.md \
              --output release-body.md

      - name: Inspect durable GitHub Release
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        id: release_state
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -eu
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > release-pages.json
          PYTHONPATH="$GITHUB_WORKSPACE/tooling" \
            python3 -m internal.release.publication \
              select \
              --release-dir release-a \
              --releases-json release-pages.json \
              --selected-json release-state.json \
              --redundant-ids redundant-release-ids.txt \
              --notes release-body.md \
              --version "${{ steps.identity.outputs.version }}" \
              --tag "${{ steps.identity.outputs.tag }}" \
              --source-revision "${{ steps.identity.outputs.source_revision }}" \
              --previous-revision "${{ steps.identity.outputs.previous_revision }}" \
              --previous-version "${{ steps.identity.outputs.previous_version }}" \
              --source-date-epoch "${{ steps.identity.outputs.source_date_epoch }}" \
              --published-at "${{ steps.identity.outputs.published_at }}"

      - name: Remove redundant compatible draft Releases
        if: ${{ steps.identity.outputs.eligible == 'true' && steps.release_state.outputs.redundant_count != '0' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -eu
          while IFS= read -r release_id; do
            test -n "$release_id"
            gh api --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done < redundant-release-ids.txt

      - name: Recreate missing draft GitHub Release
        id: create_release
        if: ${{ steps.identity.outputs.eligible == 'true' && steps.release_state.outputs.release_state == 'missing' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_REVISION: ${{ steps.identity.outputs.source_revision }}
          CHANNEL: ${{ steps.identity.outputs.channel }}
        run: |
          set -eu
          if [ "$CHANNEL" = "stable" ]; then
            prerelease=false
          else
            prerelease=true
          fi
          jq -n \
            --arg tag "$TAG" \
            --arg target "$SOURCE_REVISION" \
            --rawfile body release-body.md \
            --argjson prerelease "$prerelease" \
            '{
              tag_name: $tag,
              target_commitish: $target,
              name: $tag,
              body: $body,
              draft: true,
              prerelease: $prerelease
            }' > create-release.json
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases" \
            --input create-release.json \
            > release-state.json
          release_id=$(jq -r '.id // empty' release-state.json)
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Resolve active GitHub Release
        id: active_release
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        working-directory: source
        env:
          DISCOVERED_STATE: ${{ steps.release_state.outputs.release_state }}
          DISCOVERED_ID: ${{ steps.release_state.outputs.release_id }}
          CREATED_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          set -eu
          if [ "$DISCOVERED_STATE" = "missing" ]; then
            release_id="$CREATED_ID"
          else
            release_id="$DISCOVERED_ID"
          fi
          test -n "$release_id"
          test "$(jq -r .id release-state.json)" = "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Plan idempotent asset recovery
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        id: plan
        working-directory: source
        run: |
          set -eu
          PYTHONPATH="$GITHUB_WORKSPACE/tooling" \
            python3 -m internal.release.publication \
              plan \
              --release-dir release-a \
              --release-json release-state.json \
              --upload-dir release-upload \
              --notes release-body.md \
              --version "${{ steps.identity.outputs.version }}" \
              --tag "${{ steps.identity.outputs.tag }}" \
              --source-revision "${{ steps.identity.outputs.source_revision }}" \
              --previous-revision "${{ steps.identity.outputs.previous_revision }}" \
              --previous-version "${{ steps.identity.outputs.previous_version }}" \
              --source-date-epoch "${{ steps.identity.outputs.source_date_epoch }}" \
              --published-at "${{ steps.identity.outputs.published_at }}"

      - name: Attest verified draft assets
        if: ${{ steps.identity.outputs.eligible == 'true' && steps.plan.outputs.release_state == 'draft' }}
        uses: actions/attest@v4
        with:
          subject-path: source/release-a/*

      - name: Upload only missing draft assets
        if: ${{ steps.identity.outputs.eligible == 'true' && steps.plan.outputs.missing_count != '0' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_ID: ${{ steps.active_release.outputs.release_id }}
        run: |
          set -eu
          for asset in release-upload/*; do
            name=$(basename "$asset")
            encoded_name=$(python3 -c \
              'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
              "$name")
            curl --fail-with-body --silent --show-error -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$encoded_name" \
              --data-binary "@$asset" \
              >/dev/null
          done

      - name: Publish qualified release
        if: ${{ steps.identity.outputs.eligible == 'true' && steps.plan.outputs.release_state == 'draft' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_ID: ${{ steps.active_release.outputs.release_id }}
        run: |
          set -eu
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            > release-published.json
          test "$(jq -r .draft release-published.json)" = false

      - name: Verify immutable published release
        if: ${{ steps.identity.outputs.eligible == 'true' }}
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release-final.json
          PYTHONPATH="$GITHUB_WORKSPACE/tooling" \
            python3 -m internal.release.publication \
              plan \
              --release-dir release-a \
              --release-json release-final.json \
              --upload-dir release-verify-upload \
              --notes release-body.md \
              --version "${{ steps.identity.outputs.version }}" \
              --tag "$TAG" \
              --source-revision "${{ steps.identity.outputs.source_revision }}" \
              --previous-revision "${{ steps.identity.outputs.previous_revision }}" \
              --previous-version "${{ steps.identity.outputs.previous_version }}" \
              --source-date-epoch "${{ steps.identity.outputs.source_date_epoch }}" \
              --published-at "${{ steps.identity.outputs.published_at }}"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)" = true
          gh release verify "$TAG" --format json >/dev/null

      - name: Create or update next release pull request
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_tag == '' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
