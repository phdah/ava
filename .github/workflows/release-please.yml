name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out exact tagged source
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate prepared identity
        if: ${{ steps.release.outputs.release_created == 'true' }}
        id: identity
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REVISION: ${{ steps.release.outputs.sha }}
        run: |
          set -eu
          test "$TAG" = "v$VERSION"
          test "$(cat version.txt)" = "$VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_REVISION"
          case "$VERSION" in
            *-alpha.*) channel=alpha ;;
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
            *-*) echo "Unsupported prerelease version: $VERSION" >&2; exit 1 ;;
            *) channel=stable ;;
          esac
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_REVISION")
          published_at=$(SOURCE_DATE_EPOCH="$source_date_epoch" python3 -c 'import datetime, os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]), datetime.timezone.utc).isoformat().replace("+00:00", "Z"))')
          printf 'tag=%s\nversion=%s\nsource_revision=%s\nchannel=%s\nsource_date_epoch=%s\npublished_at=%s\n' \
            "$TAG" "$VERSION" "$SOURCE_REVISION" "$channel" "$source_date_epoch" "$published_at" >> "$GITHUB_OUTPUT"

      - name: Run release qualification
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          SOURCE_REVISION: ${{ steps.identity.outputs.source_revision }}
        run: |
          set -eu
          previous_version=$(git show "${SOURCE_REVISION}^:version.txt")
          python3 internal/release/validate_release_pr.py \
            --previous-version "$previous_version"
          python3 internal/release/validate_upgrade_impact.py \
            --previous-version "$previous_version"
          internal/release/test.sh

      - name: Assemble release twice
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          set -eu
          upgrade_args=()
          if [ -f internal/release/upgrade-sources.txt ]; then
            while IFS= read -r ver || [ -n "$ver" ]; do
              [ -n "$ver" ] && upgrade_args+=(--upgrade-from "$ver")
            done < internal/release/upgrade-sources.txt
          fi
          for output in release-a release-b; do
            python3 internal/release/assemble_reviewed.py \
              --root . \
              --output "$output" \
              --version "${{ steps.identity.outputs.version }}" \
              --channel "${{ steps.identity.outputs.channel }}" \
              --source-revision "${{ steps.identity.outputs.source_revision }}" \
              --source-date-epoch "${{ steps.identity.outputs.source_date_epoch }}" \
              --published-at "${{ steps.identity.outputs.published_at }}" \
              --release-notes CHANGELOG.md \
              --upgrade-impact internal/release/upgrade-impact.json \
              "${upgrade_args[@]}"
          done
          (cd release-a && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-a.sha256
          (cd release-b && find . -type f -print0 | sort -z | xargs -0 sha256sum) > release-b.sha256
          cmp release-a.sha256 release-b.sha256
          python3 internal/release/conformance.py --root release-a --mode release --format text

      - name: Confirm draft release state
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -eu
          test "$(gh release view "${{ steps.identity.outputs.tag }}" --json isDraft --jq .isDraft)" = true

      - name: Attest verified assets
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/attest@v4
        with:
          subject-path: release-a/*

      - name: Upload assets to draft release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh release upload "${{ steps.identity.outputs.tag }}" release-a/*

      - name: Publish qualified release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
