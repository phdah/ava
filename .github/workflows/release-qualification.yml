name: Release qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Deterministic release qualification
    if: >-
      github.head_ref == 'release-please--branches--main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact release PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run session-neutral release qualification
        id: qualify
        env:
          AVA_QUALIFICATION_EXECUTOR: github-actions
          GH_TOKEN: ${{ github.token }}
        run: python3 -m internal.release.qualification_ci

      - name: Upload qualification state transition
        if: steps.qualify.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.qualify.outputs.artifact_name }}
          path: ${{ steps.qualify.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
