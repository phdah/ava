name: Release qualification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Deterministic release qualification
    if: >-
      github.head_ref == 'release-please--branches--main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact release PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run session-neutral release qualification
        id: qualify
        env:
          AVA_QUALIFICATION_EXECUTOR: github-actions
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          echo "artifact_ready=false" >> "$GITHUB_OUTPUT"

          package_changes() {
            kind=$1
            artifact_root="$RUNNER_TEMP/release-qualification-artifact"
            rm -rf "$artifact_root"
            mkdir -p "$artifact_root"
            python3 - "$artifact_root" "$kind" <<'PY'
          import json
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          artifact_root = Path(sys.argv[1])
          kind = sys.argv[2]
          result = subprocess.run(
              [
                  "git",
                  "status",
                  "--porcelain",
                  "--untracked-files=all",
                  "--",
                  "internal/release/qualification",
              ],
              check=True,
              text=True,
              capture_output=True,
          )
          files = []
          deleted = []
          for line in result.stdout.splitlines():
              if len(line) < 4:
                  continue
              path_text = line[3:]
              path = Path(path_text)
              if path.is_file():
                  destination = artifact_root / path
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)
                  files.append(path.as_posix())
              elif not path.exists():
                  deleted.append(path.as_posix())
          if not files and not deleted:
              raise SystemExit("qualification produced no repository changes to package")
          manifest = {
              "schema_version": 1,
              "kind": kind,
              "files": sorted(files),
              "delete": sorted(deleted),
          }
          (artifact_root / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            echo "artifact_ready=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=release-qualification-${kind}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "artifact_path=$artifact_root" >> "$GITHUB_OUTPUT"
          }

          request=internal/release/qualification/acceptance-request.json
          if [ -f "$request" ]; then
            jq -e '
              type == "object" and
              keys == ["identity", "run_id", "schema_version"] and
              .schema_version == 1 and
              (.identity | type == "string" and length > 0) and
              (.run_id | type == "string" and length > 0)
            ' "$request" >/dev/null
            identity=$(jq -r '.identity' "$request")
            run_id=$(jq -r '.run_id' "$request")
            internal/release/accept-release-qualification.sh \
              --identity "$identity" \
              --run-id "$run_id"
            rm "$request"
            package_changes acceptance
            exit 0
          fi

          if python3 - <<'PY'
          import subprocess
          from internal.release import qualification_automation as automation

          root = automation.REPOSITORY_ROOT
          config, catalog, _ = automation.load_configuration(root)
          pair = automation.active_pair(config, catalog)
          state = automation.load_json(root / "internal/release/qualification/current-state.json")
          pair_state = state.get("pairs", {}).get(pair["id"])
          if not isinstance(pair_state, dict) or pair_state.get("status") not in {"awaiting-user-signoff", "accepted"}:
              raise SystemExit(1)
          run_id = pair_state.get("latest_run_id")
          if not isinstance(run_id, str) or not run_id:
              raise SystemExit(1)
          run = automation.load_json(root / "internal/release/qualification/runs" / f"{run_id}.json")
          identity = run.get("execution_identity")
          if (
              run.get("automated_state") != "awaiting-user-signoff"
              or not isinstance(identity, dict)
              or identity.get("qualification_stage") != "final"
              or identity.get("qualification_mode") != "deterministic"
          ):
              raise SystemExit(1)
          revision = identity.get("repository_revision")
          if not isinstance(revision, str):
              raise SystemExit(1)
          if subprocess.run(["git", "merge-base", "--is-ancestor", revision, "HEAD"]).returncode != 0:
              raise SystemExit(1)
          changed = subprocess.run(
              ["git", "diff", "--name-only", revision, "HEAD"],
              check=True,
              text=True,
              capture_output=True,
          ).stdout.splitlines()
          if any(path and not path.startswith("internal/release/qualification/") for path in changed):
              raise SystemExit(1)
          print(f"reusing final deterministic qualification evidence: {run_id}")
          PY
          then
            exit 0
          fi

          target_version=$(cat version.txt)
          if [ -f "internal/release/catalogs/$target_version.json" ]; then
            stage=final
          else
            stage=pre-edge
          fi

          internal/release/run-release-qualification.sh "$stage"

          if [ "$stage" = final ]; then
            package_changes evidence
          fi

      - name: Upload qualification state transition
        if: steps.qualify.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.qualify.outputs.artifact_name }}
          path: ${{ steps.qualify.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7
